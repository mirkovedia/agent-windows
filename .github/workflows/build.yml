# .github/workflows/build.yml
name: build
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -o agent.exe ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows-amd64
          path: agent.exe
